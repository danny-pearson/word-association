name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d ./cmd ./internal
            exit 1
          fi

      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check generated code is up to date
        run: |
          go tool sqlc generate
          git diff --exit-code internal/db/gen/

      - name: Check migrations apply
        run: go tool goose -dir internal/db/migrations sqlite3 /tmp/ci.db up
      
      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
